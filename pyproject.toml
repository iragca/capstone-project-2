[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "src"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "duckdb>=1.3.0",
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.7",
    "loguru>=0.7.3",
    "matplotlib>=3.10.3",
    "mlflow>=3.1.1",
    "networkx>=3.5",
    "numpy>=2.3.0",
    "openpyxl>=3.1.5",
    "pandas>=2.3.0",
    "pocketbase>=0.15.0",
    "polars>=1.30.0",
    "psutil>=7.0.0",
    "pydantic>=2.11.5",
    "pynvml>=12.0.0",
    "pyotp>=2.9.0",
    "pyrefly>=0.18.0",
    "scipy>=1.16.0",
    "seaborn>=0.13.2",
    "timm>=1.0.15",
    "torch>=2.7.1",
    "torch-geometric>=2.6.1",
    "torchvision>=0.22.1",
    "tqdm>=4.67.1",
    "tweety-ns>=2.3.3",
    "twikit>=2.3.3",
    "typer>=0.16.0",
]

[dependency-groups]
dev = [
    "src",
]

[tool.uv.sources]
src = { workspace = true }
