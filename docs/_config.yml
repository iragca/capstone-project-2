title: Capstone Project 2
author: Chris Andrei Irag
copyright: "2025"

# logo: docs/images/gradient-descent.jpg
# execute:
#   execute_notebooks: force

# Add a bibtex file so that we can create citations
# bibtex_bibfiles:
#   - references.bib

sphinx:
  config:
    mathjax_path: https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
    autodoc_mock_imports: ["torch", "pocketbase", "tqdm", "requests", "networkx"]
  extra_extensions:
    - sphinx.ext.autodoc
    - sphinx.ext.autosummary
    - sphinx.ext.napoleon   # for Google/NumPy-style docstrings
    - sphinx.ext.viewcode   # link to source code

execute:
  execute_notebooks: "off"

repository:
  url: https://github.com/iragca/capstone-project-2 # The URL to your book's repository
  path_to_book: "" # A path to your book's folder, relative to the repository root.
  branch: master # Which branch of the repository should be used when creating links

parse:
  myst_enable_extensions:
    - deflist
    - colon_fence
    - smartquotes
    - linkify

html:
  use_repository_button: true
